<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/appDesktop.css">
    <title>ElectriSwift | Soluções Energéticas Inteligentes</title>
</head>

<body>
    <header class="app-header">
        <div class="logo-wrapper">
            <img src="./assets/Raio01.png" alt="" class="logo">
            <h1 class="nome">
                Electri<span class="destaque">Swift</span>
            </h1>
        </div>

        <ul class="drawer-links">
            <li class="drawer-link-item">
                <a href="./index.html">Início</a>
            </li>

            <li class="drawer-link-item">
                <a href="./about.html">Sobre</a>
            </li>
        </ul>

        <button id="drawer-restart-btn" class="btn-action">Reiniciar
        </button>
    </header>

    <main>
        <section class="Etapa01">
            <div class="container-etapa01">
                <div class="container-etapa01-esquerdo">
                    <h1 class="etapa01-titulo">
                        Cadastre
                        <span class="destaque">seu aparelho</span>
                    </h1>

                    <p class="etapa01-descricao">
                        Informe os dados do seu aparelho para calcular o consumo de energia e estimar os seus gastos.
                    </p>

                    <div class="ilustracao-wrapper">
                        <img src="./assets/lampadaverde.png" alt="Ilustração Lâmpada ElectriSwift"
                            class="etapa01-ilustracao">
                    </div>

                    <ul class="etapa01-beneficios-esquerdo">
                        <li class="etapa01-beneficio">Calculo de energia</li>
                        <li class="etapa01-beneficio">Previsão de gastos</li>
                        <li class="etapa01-beneficio">Mais controle sobre seu consumo</li>
                    </ul>
                </div>

                <div class="container-etapa01-direito">
                    <h2 class="card-header-title-h2">Informações de Aparelhos</h2>
                    <div class="divider-line"></div>

                    <div class="search-filter-bar">
                        <div class="search-input-wrapper">
                            <input 
                            type="text" 
                            id="input-busca-aparelho"
                            placeholder="Digite o nome de um aparelho ou selecione da lista...">

                            <button class="btn-search">
                                <img 
                                src="./assets/procurar.png" 
                                alt="Ícone de Busca" 
                                class="search-icon-btn">
                            </button>
                        </div>

                        <button type="button" id="btn-filtro-categoria" class="btn-filtro-desktop">
                            Filtrar
                        </button>
                    </div>

                    <div id="lista-resultados-busca" class="resultados-busca-container">
                        <!-- Preenchido dinamicamente pelo JS quando o usuário digita ou filtra -->
                    </div>

                    <div id="aparelhos-adicionados-container" class="aparelhos-adicionados-lista">
                        <!-- Cards adicionados aparecem aqui -->
                    </div>

                    <div class="resumo-geral-card">
                        <div class="resumo-geral-info">
                            <span class="resumo-titulo">
                                Consumo Mensal Estimado
                            </span>
                        </div>
                        <div class="resumo-valor-total" id="consumo-total-geral">0,00 kWh</div>
                    </div>

                    <!-- Botão Ver Resultados -->
                    <button type="button" id="btn-ver-resultados" class="btn-continuar-desktop" disabled>
                        Ver Resultados
                    </button>
                </div>
            </div>
        </section>

        <section class="Etapa02"></section>
        <section class="Etapa03"></section>
        <section class="Etapa04"></section>
    </main>
</body>
<script src="./js/app/controller-desktop.js"></script>
</html>
